<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Frosted tile background -->
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef5ff"/>
      <stop offset="0.55" stop-color="#cfe0fb"/>
      <stop offset="1" stop-color="#a9c6f2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Glass facets -->
    <linearGradient id="peakL" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#7fa6ec" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="peakR" x1="1" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#5d86e0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#2f5bc4" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="sideL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9d0fa" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#5c86e2" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="sideR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93b3f3" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#3a66cf" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="tileClip">
      <rect x="0" y="0" width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tileClip)">
    <rect width="512" height="512" fill="url(#tile)"/>
    <rect width="512" height="512" fill="url(#glow)"/>

    <!-- Blurred color behind the glass for refraction depth -->
    <ellipse cx="270" cy="360" rx="170" ry="70" fill="#3d6fd8" opacity="0.35" filter="url(#soft)"/>

    <!-- Mountain facets -->
    <polygon points="70,410 190,265 250,410" fill="url(#sideL)" stroke="#ffffff" stroke-opacity="0.7" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="196,410 290,108 360,410" fill="url(#peakR)" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="150,410 290,108 250,410" fill="url(#peakL)" stroke="#ffffff" stroke-opacity="0.85" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="300,410 372,250 442,410" fill="url(#sideR)" stroke="#ffffff" stroke-opacity="0.6" stroke-width="3" stroke-linejoin="round"/>

    <!-- Snow cap -->
    <polygon points="290,108 262,196 284,182 300,204 314,176" fill="#ffffff" opacity="0.92"/>

    <!-- Base reflection line -->
    <rect x="62" y="408" width="388" height="4" rx="2" fill="#ffffff" opacity="0.6"/>

    <!-- Glossy top sheen -->
    <path d="M0,0 H512 V170 C380,215 150,215 0,250 Z" fill="url(#shine)" opacity="0.55"/>
  </g>

  <!-- Glass rim -->
  <rect x="5" y="5" width="502" height="502" rx="108" fill="none" stroke="url(#rim)" stroke-width="10"/>
</svg>
